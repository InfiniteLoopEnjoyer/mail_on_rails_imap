name: Security

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: "41 3 * * *" # nightly advisory check

jobs:
  bundler_audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Check the bundle against the Ruby advisory database
        run: bundle exec bundler-audit check --update
